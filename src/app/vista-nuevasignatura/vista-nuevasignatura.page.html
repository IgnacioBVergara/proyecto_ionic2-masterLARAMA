<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="volverAtras()" fill="clear">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title style="text-align: center; margin-left: -80px; font-weight: bold;">Nueva Asignatura</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="colorcito" style="--background: linear-gradient(to bottom, #ADD8E6, #7FFFD4);">
  <div style="text-align: center; margin: 20px 0;">
    <ion-avatar style="display: inline-block;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png" alt="Profile Picture" />
    </ion-avatar>
    <ion-label style="display: block; margin-top: 10px; font-size: 24px; font-weight: bold;">Registrar Nueva Asignatura</ion-label>
  </div>

  <!-- Nombre de la asignatura -->
  <div style="width: 100%; display: flex; justify-content: center; margin: 20px 0;">
    <ion-input [(ngModel)]="nombreAsignatura" name="nombreAsignatura" placeholder="Nombre de la Asignatura" style="flex: 1; max-width: 400px;" required></ion-input>
  </div>

  <!-- Sección -->
  <div style="width: 100%; display: flex; justify-content: center; margin: 20px 0;">
    <ion-input [(ngModel)]="seccion" name="seccion" placeholder="Sección" style="flex: 1; max-width: 400px;" required></ion-input>
  </div>

  <!-- Botón para guardar los cambios -->
  <div style="width: 100%; display: flex; justify-content: center; margin: 30px 0;">
    <ion-button size="large" color="primary" style="flex: 1; max-width: 400px; text-align: center;" (click)="guardarCambios()">
      <ion-icon slot="start" name="save-outline"></ion-icon>
      Guardar Cambios
    </ion-button>
  </div>
</ion-content>

<style>
  ion-content {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
  }

  ion-input {
    --padding-start: 10px;
    --padding-end: 10px;
  }

  ion-button {
    --size: 60px;
    font-size: 1.5rem;
    margin: 0 10px;
  }
</style>
